name: 03 - 🧹 Clean Videos Folder

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Clean Videos
        run: |
          # حذف تمام فایل‌ها و زیرپوشه‌ها بدون آسیب زدن به خود پوشه اصلی
          rm -rf videos/*
          mkdir -p videos
          # ساخت یک فایل نشانه تا پوشه خالی نماند و گیت ارور ندهد
          echo "# Videos Directory Cleared" > videos/README.md

      - name: Commit and Push
        run: |
          git add videos/README.md
          # بررسی هوشمند تغییرات؛ اگر پوشه از قبل خالی بود هم بدون ارور عبور می‌کند
          if ! git diff --cached --quiet; then
            git commit -m "🧹 Cleaned up videos folder"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Storage is already clean. Nothing to do!"
          fi
