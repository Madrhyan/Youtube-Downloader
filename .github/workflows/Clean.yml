name: 03 - 🧹 Clean Videos Folder

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Clean Videos
        run: |
          rm -rf videos/*
          mkdir -p videos
          echo "# Videos Cleared" > videos/README.md

      - name: Commit and Push
        run: |
          git add videos/
          git diff --cached --quiet || git commit -m "🧹 Cleaned up videos folder"
          git push origin HEAD:${{ github.ref_name }}
