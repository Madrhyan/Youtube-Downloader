name: 02 - 🚀 Ultimate Anti-Block YouTube Downloader (Custom Edition)

on:
  workflow_dispatch:
    inputs:
      video_urls:
        description: '📥 لینک ویدیوها - چند لینک را با فاصله از هم جدا کنید'
        required: true
        type: string
      video_quality:
        description: '🎬 انتخاب کیفیت ویدیو'
        required: true
        type: choice
        default: 'best'
        options:
          - 'best'
          - '1080'
          - '720'
          - '480'
          - '360'

jobs:
  get-video-free:
    name: "📥 Processing Video Download Workflow"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Show System Notice
        run: |
          echo ""
          echo "========================================"
          echo "🚀 ULTIMATE YOUTUBE DOWNLOADER"
          echo "========================================"
          echo ""
          echo "🎯 Selected Quality: ${{ github.event.inputs.video_quality }}"
          echo ""
          echo "========================================"
          echo ""

      - name: Check URL provided
        run: |
          if [ -z "${{ github.event.inputs.video_urls }}" ]; then
            echo "❌ No video URL provided!"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git for Large Files
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Start WARP Container
        run: |
          echo "Starting Cloudflare WARP container..."
          docker network create warp-net || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp
          echo "Waiting for WARP to initialize (15 seconds)..."
          sleep 15
          for i in {1..5}; do
            RESULT=$(curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP is active!"
              break
            else
              echo "Attempt $i/5 - WARP not ready yet, waiting..."
              sleep 5
            fi
          done

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg zip p7zip-full curl jq bc unzip
          curl -fs
